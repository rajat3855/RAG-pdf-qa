<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Q&A</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0f0e;
    --surface: #141714;
    --border: #232623;
    --border-bright: #2e332e;
    --accent: #00e676;
    --accent-dim: #00e67622;
    --accent-mid: #00e67644;
    --text: #e8ede8;
    --text-muted: #6b776b;
    --text-dim: #3a433a;
    --user-bg: #0a1f0f;
    --ai-bg: #141714;
    --font-mono: 'IBM Plex Mono', monospace;
    --font-sans: 'IBM Plex Sans', sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    height: 100vh;
    display: grid;
    grid-template-columns: 280px 1fr;
    overflow: hidden;
  }

  /* Sidebar */
  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 24px 20px;
    gap: 24px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-icon {
    width: 32px;
    height: 32px;
    border: 1.5px solid var(--accent);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--accent);
    font-weight: 500;
    flex-shrink: 0;
  }

  .logo-text {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    letter-spacing: 0.02em;
  }

  .logo-sub {
    font-size: 10px;
    color: var(--text-muted);
    font-family: var(--font-mono);
    margin-top: 2px;
  }

  /* Upload zone */
  .upload-section label { font-size: 10px; color: var(--text-muted); font-family: var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; display: block; margin-bottom: 10px; }

  .drop-zone {
    border: 1.5px dashed var(--border-bright);
    border-radius: 8px;
    padding: 20px 16px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
  }

  .drop-zone:hover, .drop-zone.drag { border-color: var(--accent); background: var(--accent-dim); }

  .drop-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }

  .drop-icon { font-size: 22px; margin-bottom: 8px; }

  .drop-text { font-size: 12px; color: var(--text-muted); font-family: var(--font-mono); line-height: 1.5; }

  .drop-text span { color: var(--accent); }

  /* Status */
  .status-bar {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    font-family: var(--font-mono);
    font-size: 11px;
    display: none;
    gap: 8px;
    align-items: flex-start;
  }

  .status-bar.show { display: flex; }
  .status-bar.ok { border-color: var(--accent); color: var(--accent); }
  .status-bar.err { border-color: #ff5252; color: #ff5252; }
  .status-bar.loading { border-color: var(--border-bright); color: var(--text-muted); }

  .status-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: currentColor; flex-shrink: 0; margin-top: 3px;
  }

  .status-bar.loading .status-dot { animation: pulse 1s infinite; }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* Doc info */
  .doc-info {
    background: var(--accent-dim);
    border: 1px solid var(--accent-mid);
    border-radius: 6px;
    padding: 10px 12px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--accent);
    display: none;
    gap: 8px;
    align-items: center;
  }

  .doc-info.show { display: flex; }

  .doc-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }

  /* Sidebar footer */
  .sidebar-footer {
    margin-top: auto;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    font-size: 10px;
    color: var(--text-dim);
    font-family: var(--font-mono);
    line-height: 1.6;
  }

  /* Main */
  .main {
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* Top bar */
  .topbar {
    padding: 16px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .topbar-title { font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); }
  .topbar-title span { color: var(--accent); }

  .clear-btn {
    background: none; border: 1px solid var(--border); color: var(--text-muted);
    font-family: var(--font-mono); font-size: 11px; padding: 5px 12px;
    border-radius: 4px; cursor: pointer; transition: all 0.15s;
  }

  .clear-btn:hover { border-color: var(--border-bright); color: var(--text); }

  /* Chat */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 28px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    scroll-behavior: smooth;
  }

  .chat-area::-webkit-scrollbar { width: 4px; }
  .chat-area::-webkit-scrollbar-track { background: transparent; }
  .chat-area::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 2px; }

  /* Empty state */
  .empty-state {
    margin: auto;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    opacity: 0.5;
  }

  .empty-state .big { font-size: 36px; }
  .empty-state p { font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); line-height: 1.8; }

  /* Messages */
  .msg {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-width: 780px;
    animation: fadeUp 0.25s ease;
  }

  @keyframes fadeUp { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: translateY(0); } }

  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.ai { align-self: flex-start; align-items: flex-start; }

  .msg-label { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); letter-spacing: 0.06em; padding: 0 4px; }

  .msg-bubble {
    padding: 14px 18px;
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.7;
    max-width: 100%;
  }

  .msg.user .msg-bubble {
    background: var(--user-bg);
    border: 1px solid #1a3322;
    color: var(--text);
    border-radius: 10px 10px 2px 10px;
  }

  .msg.ai .msg-bubble {
    background: var(--ai-bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px 10px 10px 2px;
  }

  /* Sources */
  .sources {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 10px;
  }

  .sources-label { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); letter-spacing: 0.06em; }

  .source-chip {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 12px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-muted);
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }

  .source-page { color: var(--accent); flex-shrink: 0; }

  .source-text { line-height: 1.5; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; }

  /* Thinking */
  .thinking {
    display: flex;
    gap: 5px;
    align-items: center;
    padding: 14px 18px;
    background: var(--ai-bg);
    border: 1px solid var(--border);
    border-radius: 10px 10px 10px 2px;
  }

  .thinking span {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--accent); opacity: 0.4;
    animation: blink 1.2s infinite;
  }

  .thinking span:nth-child(2) { animation-delay: 0.2s; }
  .thinking span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes blink { 0%,80%,100%{opacity:0.2} 40%{opacity:1} }

  /* Input */
  .input-area {
    padding: 20px 28px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }

  .input-wrap {
    display: flex;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 6px 6px 6px 18px;
    transition: border-color 0.2s;
  }

  .input-wrap:focus-within { border-color: var(--accent); }

  .input-wrap textarea {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 14px;
    resize: none;
    padding: 8px 0;
    min-height: 40px;
    max-height: 140px;
    line-height: 1.5;
  }

  .input-wrap textarea::placeholder { color: var(--text-dim); }

  .send-btn {
    background: var(--accent);
    border: none;
    color: #000;
    width: 38px; height: 38px;
    border-radius: 7px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    align-self: flex-end;
    transition: opacity 0.15s, transform 0.1s;
    font-size: 16px;
  }

  .send-btn:hover { opacity: 0.85; transform: scale(1.04); }
  .send-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }

  .input-hint { font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); margin-top: 8px; text-align: center; }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="logo">
    <div class="logo-icon">Rg</div>
    <div>
      <div class="logo-text">RAG Q&A</div>
      <div class="logo-sub">PDF Question Answering</div>
    </div>
  </div>

  <div class="upload-section">
    <label>Upload document</label>
    <div class="drop-zone" id="dropZone">
      <input type="file" accept=".pdf" id="fileInput">
      <div class="drop-icon">📄</div>
      <div class="drop-text">Drop PDF here or<br><span>click to browse</span></div>
    </div>
  </div>

  <div class="status-bar" id="statusBar">
    <div class="status-dot"></div>
    <div id="statusText"></div>
  </div>

  <div class="doc-info" id="docInfo">
    <span>✓</span>
    <span class="doc-name" id="docName"></span>
  </div>

  <div class="sidebar-footer">
    Stack: FastAPI · LangChain<br>FAISS · Llama 3 · sentence-transformers<br><br>
    Running on localhost:8000
  </div>
</aside>

<main class="main">
  <div class="topbar">
    <div class="topbar-title">session / <span id="topbarDoc">no document loaded</span></div>
    <button class="clear-btn" onclick="clearChat()">clear chat</button>
  </div>

  <div class="chat-area" id="chatArea">
    <div class="empty-state" id="emptyState">
      <div class="big">🗂</div>
      <p>Upload a PDF on the left,<br>then ask anything about it.</p>
    </div>
  </div>

  <div class="input-area">
    <div class="input-wrap">
      <textarea id="questionInput" placeholder="Ask a question about your document..." rows="1"
        onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendQuestion()" disabled>↑</button>
    </div>
    <div class="input-hint">Enter to send · Shift+Enter for new line</div>
  </div>
</main>

<script>
  const API = 'http://127.0.0.1:8000';
  let currentFile = null;

  // Drop zone drag events
  const dropZone = document.getElementById('dropZone');
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault(); dropZone.classList.remove('drag');
    const file = e.dataTransfer.files[0];
    if (file && file.name.endsWith('.pdf')) handleFile(file);
  });

  document.getElementById('fileInput').addEventListener('change', e => {
    if (e.target.files[0]) handleFile(e.target.files[0]);
  });

  function setStatus(type, text) {
    const bar = document.getElementById('statusBar');
    bar.className = 'status-bar show ' + type;
    document.getElementById('statusText').textContent = text;
  }

  async function handleFile(file) {
    setStatus('loading', 'Ingesting ' + file.name + '...');
    document.getElementById('docInfo').classList.remove('show');

    const form = new FormData();
    form.append('file', file);

    try {
      const res = await fetch(API + '/upload', { method: 'POST', body: form });
      const data = await res.json();

      if (data.chunks_stored !== undefined) {
        currentFile = file.name;
        setStatus('ok', `Ready · ${data.chunks_stored} chunks indexed`);
        document.getElementById('docInfo').classList.add('show');
        document.getElementById('docName').textContent = file.name;
        document.getElementById('topbarDoc').textContent = file.name;
        document.getElementById('sendBtn').disabled = false;
        document.getElementById('emptyState').style.display = 'none';
      } else {
        setStatus('err', data.detail || 'Upload failed');
      }
    } catch (err) {
      setStatus('err', 'Cannot reach API — is server running?');
    }
  }

  function addMessage(role, content, sources) {
    const area = document.getElementById('chatArea');
    const div = document.createElement('div');
    div.className = 'msg ' + role;

    const label = document.createElement('div');
    label.className = 'msg-label';
    label.textContent = role === 'user' ? 'YOU' : 'ASSISTANT';

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.textContent = content;

    div.appendChild(label);
    div.appendChild(bubble);

    if (sources && sources.length > 0) {
      const srcDiv = document.createElement('div');
      srcDiv.className = 'sources';
      const srcLabel = document.createElement('div');
      srcLabel.className = 'sources-label';
      srcLabel.textContent = 'SOURCES';
      srcDiv.appendChild(srcLabel);

      sources.forEach(s => {
        const chip = document.createElement('div');
        chip.className = 'source-chip';
        chip.innerHTML = `<span class="source-page">pg.${s.page}</span><span class="source-text">${s.text_preview.replace(/\\n/g, ' ')}</span>`;
        srcDiv.appendChild(chip);
      });

      div.appendChild(srcDiv);
    }

    area.appendChild(div);
    area.scrollTop = area.scrollHeight;
    return div;
  }

  function addThinking() {
    const area = document.getElementById('chatArea');
    const div = document.createElement('div');
    div.className = 'msg ai';
    div.id = 'thinking';

    const label = document.createElement('div');
    label.className = 'msg-label';
    label.textContent = 'ASSISTANT';

    const bubble = document.createElement('div');
    bubble.className = 'thinking';
    bubble.innerHTML = '<span></span><span></span><span></span>';

    div.appendChild(label);
    div.appendChild(bubble);
    area.appendChild(div);
    area.scrollTop = area.scrollHeight;
  }

  function removeThinking() {
    const t = document.getElementById('thinking');
    if (t) t.remove();
  }

  async function sendQuestion() {
    const input = document.getElementById('questionInput');
    const q = input.value.trim();
    if (!q || !currentFile) return;

    input.value = '';
    autoResize(input);
    addMessage('user', q);
    addThinking();
    document.getElementById('sendBtn').disabled = true;

    try {
      const res = await fetch(API + '/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: q, filename: currentFile })
      });
      const data = await res.json();
      removeThinking();

      if (data.answer) {
        addMessage('ai', data.answer, data.sources);
      } else {
        addMessage('ai', data.error || 'Something went wrong.');
      }
    } catch (err) {
      removeThinking();
      addMessage('ai', 'Error: Cannot reach the API server.');
    }

    document.getElementById('sendBtn').disabled = false;
    input.focus();
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendQuestion(); }
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 140) + 'px';
  }

  function clearChat() {
    const area = document.getElementById('chatArea');
    area.innerHTML = '';
    if (!currentFile) {
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.id = 'emptyState';
      empty.innerHTML = '<div class="big">🗂</div><p>Upload a PDF on the left,<br>then ask anything about it.</p>';
      area.appendChild(empty);
    }
  }
</script>
</body>
</html>
